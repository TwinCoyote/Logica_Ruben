name: AppCli - Test

on:
  push:
    branches:
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependecies
        run: pip install -r requirements.txt

      - name: Install App
        run: pip install -e .

      - name: Create challenge file
        shell: bash
        run: reto create 27
